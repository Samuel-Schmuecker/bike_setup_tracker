name: Backup Supabase DB & Storage

on:
  schedule:
    # Jeden Sonntag um 03:00 UTC (04:00 MEZ / 05:00 MESZ).
    - cron: '0 3 * * 0'
  workflow_dispatch:

# Der separate PAT autorisiert den Zugriff auf das Backup-Repository.
permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BACKUP_REPOSITORY: Samuel-Schmuecker/bike-setup-tracker-backups

    steps:
      - name: Secrets und privates Ziel-Repository pruefen
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_PAT }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SUPABASE_S3_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
        run: |
          set -euo pipefail
          missing=0
          for secret in GH_TOKEN SUPABASE_DB_URL SUPABASE_S3_ACCESS_KEY_ID SUPABASE_S3_SECRET_ACCESS_KEY SUPABASE_S3_REGION SUPABASE_S3_ENDPOINT; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Secret fehlt: ${secret} (GH_TOKEN = BACKUP_REPO_PAT)."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then exit 1; fi
          gh api "repos/$BACKUP_REPOSITORY" > "$RUNNER_TEMP/backup-repository.json"
          if ! jq -e '.private == true and .permissions.push == true' "$RUNNER_TEMP/backup-repository.json" > /dev/null; then
            echo "::error::Das Backup-Repository muss privat sein und der PAT Schreibzugriff haben."
            exit 1
          fi

      - name: Backup-Repository auschecken
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKUP_REPOSITORY }}
          token: ${{ secrets.BACKUP_REPO_PAT }}
          path: backup-repo

      - name: Supabase CLI installieren
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Rollen, Schema und Daten exportieren
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/supabase-backup"
          supabase db dump --db-url "$DB_URL" --role-only -f "$RUNNER_TEMP/supabase-backup/roles.sql"
          supabase db dump --db-url "$DB_URL" -f "$RUNNER_TEMP/supabase-backup/schema.sql"
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f "$RUNNER_TEMP/supabase-backup/data.sql"
          for dump in roles schema data; do
            test -s "$RUNNER_TEMP/supabase-backup/$dump.sql"
          done

      - name: Storage-Bucket bike-images sichern
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          SUPABASE_S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          aws --version
          aws configure set default.s3.addressing_style path
          mkdir -p "$RUNNER_TEMP/supabase-backup/bike-images"
          aws s3 sync s3://bike-images "$RUNNER_TEMP/supabase-backup/bike-images" \
            --endpoint-url "$SUPABASE_S3_ENDPOINT" --only-show-errors

      - name: Vollstaendiges Backup committen und pushen
        working-directory: backup-repo
        run: |
          set -euo pipefail
          # Erst nach allen erfolgreichen Exporten den letzten Stand ersetzen.
          mkdir -p latest
          rsync -a --delete "$RUNNER_TEMP/supabase-backup/" latest/
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add --all --force -- latest
          if git diff --cached --quiet; then
            echo "Keine Aenderungen seit dem letzten Backup." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Backup $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "HEAD:$(git branch --show-current)"
          echo "Datenbank und bike-images wurden nach $BACKUP_REPOSITORY gesichert (Commit $(git rev-parse --short HEAD))." >> "$GITHUB_STEP_SUMMARY"
