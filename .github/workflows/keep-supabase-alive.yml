name: Keep Supabase Alive

on:
  schedule:
    # Vier echte Datenbankabfragen pro Tag (UTC).
    - cron: '17 */6 * * *'
  workflow_dispatch: # manuelles Triggern zum Testen

permissions:
  contents: write

concurrency:
  group: supabase-keepalive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_URL:?Missing SUPABASE_URL secret}"
          : "${SUPABASE_ANON_KEY:?Missing SUPABASE_ANON_KEY secret}"
          response=$(curl -sS --connect-timeout 10 --max-time 30 -o response.txt -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/keepalive_probe?select=id&id=eq.1" \
            -H "apikey: ${SUPABASE_ANON_KEY}")

          echo "Supabase responded with HTTP $response"
          cat response.txt
          echo

          if [ "$response" != "200" ]; then
            echo "::error::Supabase ping failed with status $response"
            exit 1
          fi
          if ! jq -e '. == [{"id": 1}]' response.txt > /dev/null; then
            echo "::error::Keepalive probe row missing or unexpected response"
            exit 1
          fi

      - name: Log ping (keeps repo active)
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p .keepalive
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') - ping OK" >> .keepalive/log.txt
          git config user.name "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .keepalive/log.txt
          git commit -m "chore: supabase keepalive ping"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
