name: Deploy Dev to GitHub Pages (Subfolder)

on:
  push:
    branches:
      - dev

permissions:
  contents: write

concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'

      - name: Dependencies installieren
        run: flutter pub get

      - name: Cache-Trennung testen
        run: flutter test test/web_cache_isolation_test.dart

      - name: Web App bauen
        run: >
          flutter build web --release --base-href "/bike_setup_tracker/dev/"
          --dart-define=APP_ENV=dev
          --dart-define=SUPABASE_URL=https://dcrkfiooddkbzljibomo.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_qdamx1ZOBq0H0j2PBgk3hg__uIm2-M6
          --dart-define=SUPABASE_IMAGE_CLEANUP_FUNCTION=super-function

      - name: Offline-Caches nach Web-Adresse trennen
        run: dart run tool/isolate_web_cache.dart

      - name: Deploy auf GitHub Pages (Unterordner /dev)
        uses: Peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          destination_dir: dev
          keep_files: true
